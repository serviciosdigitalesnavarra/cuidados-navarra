<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pared" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4E7E5"/><stop offset="1" stop-color="#C9CFCB"/></linearGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F8F7"/><stop offset="1" stop-color="#E2E6E3"/></linearGradient>
    <linearGradient id="madera" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9C7148"/><stop offset=".45" stop-color="#C79A6B"/><stop offset="1" stop-color="#8A6240"/></linearGradient>
    <linearGradient id="hoja" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E9E5A"/><stop offset="1" stop-color="#2F5F34"/></linearGradient>
    <linearGradient id="hoja2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DB46F"/><stop offset="1" stop-color="#3D7340"/></linearGradient>
    <filter id="suave"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="desenfoque"><feGaussianBlur stdDeviation="5"/></filter>
    <g id="h"><path d="M0 0 C 14 -60 10 -150 0 -230 C -10 -150 -14 -60 0 0 Z"/></g>
  </defs>
  <rect width="800" height="900" fill="url(#pared)"/>
  <circle cx="640" cy="160" r="220" fill="#fff" opacity=".35" filter="url(#suave)"/>
  <rect x="-40" y="690" width="880" height="260" fill="url(#mesa)"/>
  <ellipse cx="400" cy="700" rx="480" ry="34" fill="#fff" opacity=".7"/>
  <!-- sombras -->
  <ellipse cx="330" cy="815" rx="150" ry="18" fill="#000" opacity=".12" filter="url(#desenfoque)"/>
  <ellipse cx="560" cy="815" rx="100" ry="14" fill="#000" opacity=".1" filter="url(#desenfoque)"/>
  <!-- planta grande -->
  <g fill="url(#hoja)" transform="translate(330 520)">
    <use href="#h" transform="rotate(-62) scale(.9)"/><use href="#h" transform="rotate(-45) scale(1.05)"/>
    <use href="#h" transform="rotate(-28) scale(1.2)"/><use href="#h" transform="rotate(-12) scale(1.3)"/>
    <use href="#h" transform="rotate(4) scale(1.35)"/><use href="#h" transform="rotate(20) scale(1.2)"/>
    <use href="#h" transform="rotate(36) scale(1.1)"/><use href="#h" transform="rotate(52) scale(.95)"/>
    <use href="#h" transform="rotate(68) scale(.8)"/>
  </g>
  <g fill="url(#hoja2)" transform="translate(330 525)" opacity=".95">
    <use href="#h" transform="rotate(-52) scale(.75)"/><use href="#h" transform="rotate(-20) scale(1)"/>
    <use href="#h" transform="rotate(12) scale(1.05)"/><use href="#h" transform="rotate(44) scale(.85)"/>
    <use href="#h" transform="rotate(-36) scale(.6)"/><use href="#h" transform="rotate(28) scale(.65)"/>
  </g>
  <!-- maceta grande -->
  <path d="M215 520 h230 l-12 290 a10 10 0 0 1 -10 10 h-186 a10 10 0 0 1 -10 -10 z" fill="url(#madera)"/>
  <path d="M245 560 c40 30 120 30 170 0 M240 640 c50 25 130 25 180 -5 M238 720 c60 20 120 20 176 0" stroke="#7A5434" stroke-width="2" fill="none" opacity=".35"/>
  <rect x="215" y="516" width="230" height="10" rx="5" fill="#B18559"/>
  <!-- planta pequeña -->
  <g fill="url(#hoja2)" transform="translate(560 640)" opacity=".9" filter="url(#desenfoque)">
    <use href="#h" transform="rotate(-50) scale(.45)"/><use href="#h" transform="rotate(-20) scale(.55)"/>
    <use href="#h" transform="rotate(10) scale(.55)"/><use href="#h" transform="rotate(40) scale(.45)"/>
  </g>
  <!-- maceta pequeña -->
  <path d="M480 640 h160 l-8 172 a8 8 0 0 1 -8 8 h-128 a8 8 0 0 1 -8 -8 z" fill="url(#madera)"/>
  <path d="M500 680 c30 18 90 18 120 0 M498 740 c40 15 90 15 124 -2" stroke="#7A5434" stroke-width="2" fill="none" opacity=".3"/>
  <circle cx="610" cy="780" r="7" fill="#3a2a1c" opacity=".7"/>
</svg>
