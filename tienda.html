<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tienda · Cuidados Navarra</title>
  <meta name="description" content="Selección de productos y tecnología para el cuidado de personas mayores y dependientes: seguridad, medicación, comunicación, hogar y control de salud.">
  <meta name="theme-color" content="#EAF6EC">
  <meta name="apple-mobile-web-app-title" content="Cuidados Navarra">
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icono-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fuentes/lato-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fuentes/lato-900.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="tienda">
  <main id="contenido">
    <div class="contenedor">
      <section class="bloque">
        <div class="cabeza-seccion">
          <span class="antetitulo">Tienda</span>
          <h1 class="titulo-seccion">Tecnología y productos para cuidar mejor</h1>
          <p class="subtitulo">Una selección de productos útiles para la seguridad, la autonomía y la tranquilidad en casa. Al pulsar «Ver en…» irás a la web del proveedor, donde se realiza la compra.</p>
        </div>
        <div class="aviso-afiliado" role="note"><span aria-hidden="true">ℹ️</span><div><strong>Enlaces de afiliado.</strong> <span id="texto-aviso"></span></div></div>
        <div class="herramientas">
          <div class="filtros" id="filtros-tienda" role="group" aria-label="Filtrar productos"></div>
        </div>
        <div class="rejilla-productos" id="lista-productos" aria-live="polite"><p class="cargando">Cargando…</p></div>
      </section>
    </div>
  </main>
  <script src="js/comun.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
