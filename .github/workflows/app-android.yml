# Compila la app Android de Cuidados Navarra en los servidores de GitHub (sin instalar nada en tu ordenador).
#
# Cómo usarlo: pestaña «Actions» del repositorio › «App Android» › «Run workflow».
# Al terminar (unos 10 minutos), abajo en «Artifacts» aparece:
#   - cuidados-navarra-prueba.apk  → para instalar y probar en un móvil Android
#   - cuidados-navarra-google-play.aab → para subir a Google Play (solo si configuraste la clave de firma)
# Ver app-movil/GUIA-TIENDAS.md.
name: App Android

on:
  workflow_dispatch:
  push:
    paths:
      - "app-movil/**"
      - ".github/workflows/app-android.yml"

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      TIENE_CLAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: app-movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Capacitor
        run: npm ci --no-audit --no-fund

      - name: Crear el proyecto Android
        run: |
          node preparar-web.js
          npx cap add android
          npm run iconos -- --android
          npx cap sync android

      - name: Poner el número de versión
        # versionCode sube solo en cada compilación; versionName sale de package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compilar APK de prueba
        working-directory: app-movil/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Compilar para Google Play (firmado)
        if: env.TIENE_CLAVE == 'true'
        working-directory: app-movil/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/clave.jks"
          jarsigner -keystore "$RUNNER_TEMP/clave.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
          rm -f "$RUNNER_TEMP/clave.jks"
          mv app/build/outputs/bundle/release/app-release.aab ../cuidados-navarra-google-play.aab

      - name: Preparar archivos
        run: mv android/app/build/outputs/apk/debug/app-debug.apk cuidados-navarra-prueba.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cuidados-navarra-prueba-apk
          path: app-movil/cuidados-navarra-prueba.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app-movil/cuidados-navarra-google-play.aab') != '' }}
        with:
          name: cuidados-navarra-google-play-aab
          path: app-movil/cuidados-navarra-google-play.aab
          retention-days: 30
